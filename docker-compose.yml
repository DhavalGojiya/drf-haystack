---
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-7.17.29}
    environment:
      - discovery.type=single-node
    ports:
      - 9200:9200
    networks:
      - es_search
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  es_search:
    driver: bridge
